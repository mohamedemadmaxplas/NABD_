<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Tecno Shark | تسجيل الدخول الموحد</title>
    
    <!-- Firebase SDKs -->

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', 'Cairo', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            min-height: 100vh;

            justify-content: center;

            direction: rtl;
        }
        
        body.english {
            direction: ltr;
        }
        
        body.english .input-group label {
            text-align: left;
        }
        
        .login-container {
            width: 100%;
            max-width: 500px;
            padding: 20px;

        .login-card {
            background: white;
            border-radius: 32px;
            padding: 40px 32px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            text-align: center;
            transition: transform 0.3s ease;
        }
        
        .login-card:hover {

        }
        
        .lang-switch {
            position: fixed;
            top: 20px;
            left: 20px;
            background: rgba(255,255,255,0.2);

            border: none;

        .logo {

            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            box-shadow: 0 15px 30px -10px rgba(30, 58, 95, 0.5);
            position: relative;
            overflow: hidden;
        }
        
        .logo::before {
            content: '';
            position: absolute;
            width: 200%;

            0% { transform: translateX(-100%) rotate(45deg); }

        .logo-content {
            text-align: center;
            z-index: 1;
        }
        
        .logo-content .main-letter {
            font-size: 42px;
            font-weight: 800;
            color: white;
            letter-spacing: -2px;
        }
        
        .logo-content .small-text {
            font-size: 10px;
            color: #10b981;
            letter-spacing: 1px;
            margin-top: 4px;
        }
        
        h1 {
            font-size: 26px;
            font-weight: 700;
            margin-bottom: 8px;
            background: linear-gradient(135deg, #1e3a5f, #0f2b3d);

            color: transparent;

            color: #6b7280;

        .input-group {

        .input-group label {
            display: block;

        .input-group input:focus {

        .username-wrapper {

        .username-suffix {

        .next-btn:disabled {

        }
        
        .back-btn {

            background: transparent;
            border: 2px solid #e5e7eb;
            color: #374151;
            padding: 12px;

            font-size: 14px;
            font-weight: 500;

        .back-btn:hover {

        }
        
        .links {
            display: flex;
            justify-content: space-between;
            margin-top: 20px;
            font-size: 13px;
        }
        
        .links a {
            color: #10b981;

            transition: color 0.2s;
        }
        
        .message {
            padding: 12px;
            border-radius: 12px;
            margin-bottom: 20px;
            font-size: 14px;
            display: none;
        }
        
        .message.error {
            background: #fee2e2;
            color: #dc2626;
            border-right: 4px solid #dc2626;
            display: block;
        }
        
        .message.success {
            background: #d1fae5;
            color: #059669;
            border-right: 4px solid #059669;
            display: block;
        }
        
        .suggestions {
            margin-top: 10px;

        .suggestion-badge {
            background: #f3f4f6;

            transition: all 0.2s;

        .terms-box h3 {
            color: #1e3a5f;

        }
        
        .terms-box p {
            color: #4b5563;
            font-size: 13px;

        .agree-btn {
            width: 100%;
            background: linear-gradient(135deg, #10b981, #059669);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 16px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: #1f2937;
            color: white;
            padding: 12px 24px;
            border-radius: 50px;
            font-size: 14px;
            z-index: 1000;

            transition: opacity 0.3s;
            pointer-events: none;

        .toast.show {
            opacity: 1;
        }
        
        .step-indicator {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-bottom: 30px;
        }
        
        .step-dot {
            width: 8px;
            height: 8px;
            background: #e5e7eb;
            border-radius: 50%;
            transition: all 0.3s;

            width: 24px;
            background: #10b981;
            border-radius: 4px;
        }
        
        .step-dot.completed {
            background: #10b981;
        }
        
        @media (max-width: 480px) {
            .login-card {

</head>
<body>

<button class="lang-switch" id="langSwitch">
    <i class="fas fa-globe"></i>
    <span>English</span>
</button>

<div class="login-container" id="app"></div>
<div id="toast" class="toast"></div>

<script>
     const firebaseConfig = {
  apiKey: "AIzaSyD-atJ2hlfbAWqIaHuBgNASArZmVS6PhA0",
  authDomain: "imtihan-494010.firebaseapp.com",
  projectId: "imtihan-494010",
  storageBucket: "imtihan-494010.firebasestorage.app",
  messagingSenderId: "764038463015",
  appId: "1:764038463015:web:e57dbfcf55ac393435d802",
  measurementId: "G-2LT9PJNZK7"
};
    
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.database();
    
    // ==================== المتغيرات العامة ====================
    let currentStep = 'login';
    let currentLang = 'ar';
    let tempUserData = {
        firstName: '',
        lastName: '',
        phone: '',
        username: '',
        password: '',
        uid: null
    };
    let resetUserData = null;
    let returnToUrl = null;
    
    // ==================== دوال مساعدة ====================
    function showToast(msg) {
        const toast = document.getElementById('toast');
        toast.textContent = msg;
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 3000);
    }
    // ==================== دالة مساعدة لجلب بيانات المستخدم بشكل موحد ====================
async function getUserProfile(uid) {
    try {
        // أولاً: محاولة القراءة من الهيكل الجديد (users/uid/profile)
        const profileSnapshot = await db.ref(`users/${uid}/profile`).once('value');
        if (profileSnapshot.exists()) {
            const profile = profileSnapshot.val();
            return {
                uid: uid,
                name: profile.name || '',
                username: profile.username || '',
                email: profile.email || '',
                phone: profile.phone || '',
                password: profile.password || '',
                plan: profile.plan || 'free',
                address: profile.address || '',
                createdAt: profile.createdAt || new Date().toISOString()
            };
        }
        
        // ثانياً: محاولة القراءة من الهيكل القديم (users/uid مباشرة)
        const userSnapshot = await db.ref(`users/${uid}`).once('value');
        if (userSnapshot.exists()) {
            const userData = userSnapshot.val();
            return {
                uid: uid,
                name: userData.name || userData.profileName || '',
                username: userData.username || '',
                email: userData.email || '',
                phone: userData.phone || '',
                password: userData.password || '',
                plan: userData.plan || 'free',
                createdAt: userData.createdAt || new Date().toISOString()
            };
        }
        
        return null;
    } catch (error) {
        console.error('خطأ في جلب بيانات المستخدم:', error);
        return null;
    }
}
    function showMessage(msg, isError) {
        const box = document.getElementById('messageBox');
        if (box) {
            box.textContent = msg;
            box.className = 'message ' + (isError ? 'error' : 'success');
            setTimeout(() => {
                if (box) box.className = 'message';
            }, 3000);
        }
    }
    
    function maskUsername(username) {
        if (!username) return '';
        if (username.length <= 4) return username;
        return username.substring(0, 2) + '***' + username.substring(username.length - 2);
    }
    
    // الحصول على رابط العودة
    function getReturnUrl() {
        const urlParams = new URLSearchParams(window.location.search);
        let returnUrl = urlParams.get('returnUrl');
        
        if (!returnUrl && document.referrer) {
            returnUrl = document.referrer;
        }
        
        if (!returnUrl) {
            returnUrl = 'https://imtihan-eight.vercel.app/';
        }
        
        returnToUrl = returnUrl;
        return returnUrl;
    }
    
async function checkIdentifier() {
    const identifier = document.getElementById('loginIdentifier').value.trim();
    
    if (!identifier) {
        showMessage('الرجاء إدخال رقم الهاتف أو اسم المستخدم', true);
        return;
    }
    
    // 🔥 تشغيل التشخيص أولاً
    console.log('\n🔍 بدء تشخيص تسجيل الدخول...\n');
    const diagnosis = await diagnoseLoginIssue(identifier);
    
    if (!diagnosis.found) {
        // إذا لم يتم العثور على المستخدم، عرض رسالة مفصلة
        showMessage(`❌ لا يوجد حساب بهذه البيانات. ${diagnosis.locations.length === 0 ? 'تأكد من كتابة المعرف بشكل صحيح' : ''}`, true);
        return;
    }
    
    // إذا تم العثور على المستخدم، تابع كالمعتاد
    try {
        let foundUser = null;
        let foundUid = null;
        
        // استخراج بيانات المستخدم من أول موقع تم العثور عليه
        const firstLocation = diagnosis.locations[0];
        
        if (firstLocation.location.includes('profile')) {
            foundUser = firstLocation.data;
            foundUid = firstLocation.uid;
        } else if (firstLocation.location === 'users_simple') {
            foundUser = firstLocation.data;
            foundUid = firstLocation.uid;
        } else if (firstLocation.location === 'Firebase Authentication') {
            // إذا كان فقط في Authentication، نحتاج إلى إنشاء سجل في Database
            const email = identifier;
            const username = email.split('@')[0] + '@tecno.shark';
            const newUid = 'auth_' + Date.now();
            
            foundUser = {
                username: username,
                email: email,
                name: email.split('@')[0],
                phone: ''
            };
            foundUid = newUid;
            
            // حفظ في Database
            await db.ref(`users/${newUid}/profile`).set({
                name: foundUser.name,
                username: foundUser.username,
                email: foundUser.email,
                phone: '',
                address: '',
                createdAt: new Date().toISOString()
            });
            console.log(`✅ تم إنشاء سجل للمستخدم في Database (UID: ${newUid})`);
        }
        
        if (!foundUser) {
            showMessage('حدث خطأ في استرجاع بيانات المستخدم', true);
            return;
        }
        
        tempUserData = {
            uid: foundUid,
            username: foundUser.username,
            phone: foundUser.phone || '',
            name: foundUser.name,
            email: foundUser.email,
            firstName: foundUser.firstName || '',
            lastName: foundUser.lastName || ''
        };
        
        console.log('✅ تم تحميل بيانات المستخدم بنجاح:', {
            uid: tempUserData.uid,
            username: tempUserData.username,
            name: tempUserData.name
        });
        
        currentStep = 'password-login';
        render();
        
    } catch (error) {
        console.error('❌ خطأ في معالجة بيانات المستخدم:', error);
        showMessage('حدث خطأ: ' + error.message, true);
    }
}
    
  async function completeLogin() {
    const password = document.getElementById('loginPassword')?.value;
    
    if (!password) {
        showMessage('الرجاء إدخال كلمة المرور', true);
        return;
    }
    
    if (!tempUserData.uid) {
        showMessage('حدث خطأ، يرجى المحاولة مرة أخرى', true);
        return;
    }
    
    try {
        let isValidPassword = false;
        
        // 🔥 أولاً: محاولة التحقق من كلمة المرور في Authentication
        try {
            const email = tempUserData.email || tempUserData.username.split('@')[0] + '@tecno.com';
            await auth.signInWithEmailAndPassword(email, password);
            isValidPassword = true;
        } catch (authError) {
            // إذا فشل، تحقق من Realtime Database
            const userSnapshot = await db.ref(`users/${tempUserData.uid}`).once('value');
            const userData = userSnapshot.val();
            const storedPassword = userData?.profile?.password || userData?.password;
            
            if (storedPassword && storedPassword === password) {
                isValidPassword = true;
            }
        }
        
        if (!isValidPassword) {
            showMessage('كلمة المرور غير صحيحة', true);
            return;
        }
        
        // إنشاء رمز تسجيل الدخول
        const loginToken = {
            uid: tempUserData.uid,
            username: tempUserData.username,
            email: tempUserData.email || tempUserData.username.split('@')[0] + '@tecno.com',
            name: tempUserData.name,
            plan: 'free',
            timestamp: Date.now(),
            expires: Date.now() + (1000 * 60 * 60)
        };
        
        const encodedToken = btoa(JSON.stringify(loginToken));
        
        // ✅ تم التعديل هنا ✅
        const returnUrl = "https://imtihan-eight.vercel.app/";
        const finalUrl = `${returnUrl}?token=${encodedToken}`;
        
        showMessage('✅ تم تسجيل الدخول بنجاح! جاري التحويل...', false);
        
        setTimeout(() => {
            window.location.href = finalUrl;
        }, 1500);
        
    } catch (error) {
        console.error('خطأ:', error);
        showMessage('حدث خطأ: ' + error.message, true);
    }
}
    
    function goToLogin() {
        currentStep = 'login';
        render();
    }
    
    function goToForgot() {
        if (tempUserData && tempUserData.phone) {
            resetUserData = tempUserData;
        }
        currentStep = 'forgot';
        render();
    }
    
    // ==================== دوال استعادة كلمة المرور ====================
    async function verifyPhone() {
        const phone = document.getElementById('forgotPhone').value.trim();
        if (!phone) {
            showMessage('الرجاء إدخال رقم الهاتف', true);
            return;
        }
        
        try {
            const phoneSnapshot = await db.ref('users').orderByChild('phone').equalTo(phone).once('value');
            let foundUser = null;
            let foundUid = null;
            
            if (phoneSnapshot.exists()) {
                phoneSnapshot.forEach((child) => {
                    foundUser = child.val();
                    foundUid = child.key;
                });
            }
            
            if (!foundUser) {
                showMessage('لا يوجد حساب بهذا الرقم', true);
                return;
            }
            
            resetUserData = { uid: foundUid, ...foundUser };
            currentStep = 'reset';
            render();
            
        } catch (error) {
            showMessage('حدث خطأ', true);
        }
    }
    
    async function resetPassword() {
    const newPass = document.getElementById('newPassword').value;
    const confirmPass = document.getElementById('confirmPassword').value;
    
    if (!newPass || !confirmPass) {
        showMessage('الرجاء إدخال كلمة المرور', true);
        return;
    }
    
    if (newPass !== confirmPass) {
        showMessage('كلمة المرور غير متطابقة', true);
        return;
    }
    
    if (newPass.length < 6) {
        showMessage('كلمة المرور يجب أن تكون 6 أحرف على الأقل', true);
        return;
    }
    
    if (!resetUserData) {
        showMessage('حدث خطأ، حاول مرة أخرى', true);
        return;
    }
    
    try {
        // ✅ فقط تحديث كلمة المرور في قاعدة البيانات
        await db.ref(`users/${resetUserData.uid}/profile/password`).set(newPass);
        
        const returnUrl = getReturnUrl();
        showMessage('✅ تم تغيير كلمة المرور بنجاح! جاري التحويل...', false);
        
        setTimeout(() => {
            window.location.href = returnUrl;
        }, 1500);
        
    } catch (error) {
        console.error('خطأ:', error);
        showMessage('حدث خطأ: ' + error.message, true);
    }
}
    
    // ==================== دوال إنشاء حساب ====================
    function goToRegister() {
        tempUserData = { firstName: '', lastName: '', phone: '', username: '', password: '', uid: null };
        currentStep = 'register-step1';
        render();
    }
    
    function goToRegisterStep1() {
        currentStep = 'register-step1';
        render();
    }
    
    function goToRegisterStep2() {
        const firstName = document.getElementById('firstName')?.value.trim();
        const lastName = document.getElementById('lastName')?.value.trim();
        
        if (!firstName || !lastName) {
            showMessage('الرجاء إدخال الاسم الأول والاسم الأخير', true);
            return;
        }
        
        tempUserData.firstName = firstName;
        tempUserData.lastName = lastName;
        currentStep = 'register-step2';
        render();
    }
    
    function goToRegisterStep3() {
        const phone = document.getElementById('phone')?.value.trim();
        
        if (!phone) {
            showMessage('الرجاء إدخال رقم الهاتف', true);
            return;
        }
        
        if (phone.length < 10) {
            showMessage('رقم الهاتف غير صحيح', true);
            return;
        }
        
        tempUserData.phone = phone;
        currentStep = 'register-step3';
        render();
    }
    
   async function checkUsernameAvailability() {
    const usernameInput = document.getElementById('username');
    if (!usernameInput) return;
    
    const username = usernameInput.value.trim();
    const errorDiv = document.getElementById('usernameError');
    const nextBtn = document.getElementById('nextBtn3');
    const suggestionsDiv = document.getElementById('suggestions');
    
    // التحقق من أن username لا يحتوي على @ أو مسافات
    if (username.includes('@')) {
        if (errorDiv) {
            errorDiv.style.display = 'block';
            errorDiv.textContent = '⚠️ لا تدخل @ تلقائياً سيتم إضافتها';
            errorDiv.style.color = '#dc2626';
        }
        if (nextBtn) nextBtn.disabled = true;
        return;
    }
    
    if (!username || username.length < 3) {
        if (errorDiv) errorDiv.style.display = 'none';
        if (nextBtn) nextBtn.disabled = true;
        if (suggestionsDiv) suggestionsDiv.innerHTML = '';
        console.log('⚠️ اسم المستخدم قصير جداً (3 أحرف على الأقل)');
        return;
    }
    
    // التحقق من أن اسم المستخدم يحتوي على أحرف وأرقام فقط
    const validChars = /^[a-zA-Z0-9_]+$/;
    if (!validChars.test(username)) {
        if (errorDiv) {
            errorDiv.style.display = 'block';

            errorDiv.style.color = '#dc2626';
        }
        if (nextBtn) nextBtn.disabled = true;
        if (suggestionsDiv) suggestionsDiv.innerHTML = '';
        return;
    }
    
    try {
        const fullUsername = username + '@tecno.shark';
        console.log(`🔍 جاري التحقق من اسم المستخدم: ${fullUsername}`);
        
        // البحث في Realtime Database
        const usersSnapshot = await db.ref('users').once('value');
        const data = usersSnapshot.val();
        
        let exists = false;
        
        if (data) {
            for (let uid in data) {
                const userProfile = data[uid].profile;
                if (userProfile && userProfile.username === fullUsername) {
                    exists = true;
                    console.log(`❌ اسم المستخدم ${fullUsername} موجود بالفعل`);
                    break;
                }
            }
        }
        
        // أيضاً البحث في Firebase Authentication
        if (!exists) {
            try {
                const email = username + '@tecno.com';
                const signInMethods = await auth.fetchSignInMethodsForEmail(email);
                if (signInMethods.length > 0) {
                    exists = true;
                    console.log(`❌ البريد الإلكتروني ${email} موجود بالفعل في Authentication`);
                }
            } catch (authError) {
                console.log('ℹ️ لم نتمكن من التحقق من Authentication:', authError.message);
            }
        }
        
        if (exists) {
            // عرض رسالة الخطأ
            if (errorDiv) {
                errorDiv.style.display = 'block';
                errorDiv.textContent = '⚠️ اسم المستخدم موجود بالفعل';
                errorDiv.style.color = '#dc2626';
            }
            if (nextBtn) nextBtn.disabled = true;
            
            // إنشاء اقتراحات بديلة
            const suggestions = [];
            
            // إضافة رقم عشوائي
            suggestions.push(username + Math.floor(Math.random() * 100));
            
            // إضافة شرطة سفلية ورقم
            suggestions.push(username + '_' + Math.floor(Math.random() * 1000));
            
            // إضافة سنة
            suggestions.push(username + new Date().getFullYear());
            
            // إضافة كلمة official
            suggestions.push(username + '_official');
            
            // إضافة حرف عشوائي
            const letters = 'abcdefghijklmnopqrstuvwxyz';
            suggestions.push(username + letters[Math.floor(Math.random() * letters.length)]);
            
            // إزالة الاقتراحات المكررة
            const uniqueSuggestions = [...new Set(suggestions)];
            
            // عرض الاقتراحات
            if (suggestionsDiv) {
                suggestionsDiv.innerHTML = uniqueSuggestions.map(s => 
                    `<span class="suggestion-badge" onclick="useSuggestion('${s}')">${s}@tecno.shark</span>`
                ).join('');
                console.log(`📝 تم إنشاء ${uniqueSuggestions.length} اقتراح:`, uniqueSuggestions);
            }
            
        } else {
            // اسم المستخدم متاح
            if (errorDiv) {
                errorDiv.style.display = 'block';
                errorDiv.textContent = '✅ اسم المستخدم متاح';
                errorDiv.style.color = '#10b981';
            }
            if (nextBtn) nextBtn.disabled = false;
            if (suggestionsDiv) suggestionsDiv.innerHTML = '';
            console.log(`✅ اسم المستخدم ${fullUsername} متاح`);
        }
        
    } catch (error) {
        console.error('❌ خطأ في التحقق:', error);
        if (errorDiv) {
            errorDiv.style.display = 'block';
            errorDiv.textContent = '⚠️ حدث خطأ في التحقق من اسم المستخدم';

  async function completeRegistration() {
    const email = tempUserData.username.split('@')[0] + '@tecno.com';
    
    showMessage('جاري إنشاء الحساب...', false);
    
    try {
        const newUid = Date.now().toString() + Math.random().toString(36).substr(2, 9);
        
        // ⭐ نفس هيكل البيانات المستخدم في متجر نبض
        const newUser = {
            profile: {
                name: tempUserData.firstName + ' ' + tempUserData.lastName,
                phone: tempUserData.phone,
                username: tempUserData.username,
                email: email,
                password: tempUserData.password,
                address: '',
                createdAt: new Date().toISOString()
            }
        };
        
        // حفظ في المسار الصحيح (users/uid/profile)
        await db.ref(`users/${newUid}/profile`).set(newUser.profile);
        
        // أيضاً حفظ نسخة مبسطة للبحث السريع
        await db.ref(`users_simple/${newUid}`).set({
            name: newUser.profile.name,
            phone: newUser.profile.phone,
            username: newUser.profile.username,
            email: newUser.profile.email,
            password: newUser.profile.password
        });
        
        const loginToken = {
            uid: newUid,
            username: tempUserData.username,
            email: email,
            name: newUser.profile.name,
            plan: 'free',
            timestamp: Date.now(),
            expires: Date.now() + (1000 * 60 * 60)
        };
        
        const encodedToken = btoa(JSON.stringify(loginToken));
        
        // ✅ تم التعديل هنا ✅
        const returnUrl = "https://imtihan-eight.vercel.app/";
        const finalUrl = `${returnUrl}?token=${encodedToken}`;
        
        showMessage('✅ تم إنشاء الحساب بنجاح! جاري التحويل...', false);
        
        setTimeout(() => {
            window.location.href = finalUrl;
        }, 2000);
        
    } catch (error) {
        console.error('خطأ في إنشاء الحساب:', error);
        showMessage('❌ حدث خطأ: ' + error.message, true);
    }
}

    // ==================== دالة تشخيص متقدمة لتسجيل الدخول ====================
async function diagnoseLoginIssue(identifier) {
    console.group('🔬 تشخيص مشكلة تسجيل الدخول');
    console.log(`🔍 المعرف المدخل: "${identifier}"`);
    console.log(`📝 نوع المعرف: ${identifier.includes('@') ? 'بريد إلكتروني' : (isNaN(identifier) ? 'اسم مستخدم' : 'رقم هاتف')}`);
    
    const results = {
        found: false,
        locations: [],
        errors: []
    };
    
    // 1. البحث في Realtime Database (مسار users)
    try {
        console.log('📂 1. البحث في Realtime Database (/users)...');
        const usersSnapshot = await db.ref('users').once('value');
        const data = usersSnapshot.val();
        
        if (data) {
            let userCount = 0;
            for (let uid in data) {
                userCount++;
                const userProfile = data[uid].profile;
                if (userProfile) {
                    // التحقق من تطابق رقم الهاتف
                    if (userProfile.phone === identifier) {
                        results.found = true;
                        results.locations.push({ location: 'users/*/profile.phone', uid: uid, data: userProfile });
                        console.log(`✅ ✅ ✅ تم العثور على المستخدم عبر رقم الهاتف في المسار: users/${uid}/profile.phone`);
                    }
                    // التحقق من تطابق اسم المستخدم
                    if (userProfile.username === identifier || userProfile.username === identifier + '@tecno.shark') {
                        results.found = true;
                        results.locations.push({ location: 'users/*/profile.username', uid: uid, data: userProfile });
                        console.log(`✅ ✅ ✅ تم العثور على المستخدم عبر اسم المستخدم في المسار: users/${uid}/profile.username`);
                    }
                    // التحقق من تطابق البريد الإلكتروني
                    if (userProfile.email === identifier) {
                        results.found = true;
                        results.locations.push({ location: 'users/*/profile.email', uid: uid, data: userProfile });
                        console.log(`✅ ✅ ✅ تم العثور على المستخدم عبر البريد الإلكتروني في المسار: users/${uid}/profile.email`);
                    }
                }
            }
            console.log(`📊 إجمالي المستخدمين في قاعدة البيانات: ${userCount}`);
        } else {
            console.log('⚠️ لا توجد بيانات في مسار /users');
            results.errors.push('users path is empty');
        }
    } catch (error) {
        console.error('❌ خطأ في قراءة /users:', error);
        results.errors.push(`Database read error: ${error.message}`);
    }
    
    // 2. البحث في مسار users_simple (إذا وجد)
    try {
        console.log('📂 2. البحث في Realtime Database (/users_simple)...');
        const simpleSnapshot = await db.ref('users_simple').once('value');
        const simpleData = simpleSnapshot.val();
        
        if (simpleData) {
            for (let uid in simpleData) {
                const user = simpleData[uid];
                if (user && (user.username === identifier || user.username === identifier + '@tecno.shark' || user.phone === identifier || user.email === identifier)) {
                    results.found = true;
                    results.locations.push({ location: 'users_simple', uid: uid, data: user });
                    console.log(`✅ ✅ ✅ تم العثور على المستخدم في مسار users_simple`);
                }
            }
        } else {
            console.log('ℹ️ مسار users_simple غير موجود أو فارغ');
        }
    } catch (error) {
        console.log(`⚠️ خطأ في قراءة users_simple: ${error.message}`);
    }
    
    // 3. البحث في Firebase Authentication
    try {
        console.log('📂 3. البحث في Firebase Authentication...');
        if (identifier.includes('@')) {
            const signInMethods = await auth.fetchSignInMethodsForEmail(identifier);
            if (signInMethods.length > 0) {
                results.found = true;
                results.locations.push({ location: 'Firebase Authentication', email: identifier });
                console.log(`✅ ✅ ✅ تم العثور على البريد الإلكتروني في Firebase Authentication`);
                console.log(`📋 طرق تسجيل الدخول المتاحة: ${signInMethods.join(', ')}`);
            } else {
                console.log(`ℹ️ البريد الإلكتروني ${identifier} غير موجود في Firebase Authentication`);
            }
        } else {
            console.log(`ℹ️ "${identifier}" ليس بريداً إلكترونياً، تخطي البحث في Authentication`);
        }
    } catch (error) {
        console.log(`⚠️ خطأ في البحث في Authentication: ${error.message}`);
        results.errors.push(`Auth error: ${error.message}`);
    }
    
    // 4. التحقق من بنية البيانات (structure)
    console.log('📂 4. التحقق من بنية البيانات...');
    try {
        const structureSnapshot = await db.ref('users').limitToFirst(1).once('value');
        const sample = structureSnapshot.val();
        if (sample) {
            const firstUid = Object.keys(sample)[0];
            const firstUser = sample[firstUid];
            console.log(`📋 مثال على بنية المستخدم الأول (UID: ${firstUid}):`);
            console.log(JSON.stringify(firstUser, null, 2));
            
            // التحقق من وجود profile
            if (firstUser.profile) {
                console.log('✅ بنية البيانات صحيحة (تحتوي على profile)');
            } else if (firstUser.username || firstUser.name) {
                console.log('⚠️ بنية البيانات قديمة! البيانات موجودة مباشرة بدون profile');
                results.errors.push('Data structure error: missing "profile" object - old structure detected');
            } else {
                console.log('⚠️ بنية البيانات غير معروفة');
            }
        } else {
            console.log('ℹ️ لا توجد بيانات لعرض بنية مثال');
        }
    } catch (error) {
        console.log(`⚠️ خطأ في فحص البنية: ${error.message}`);
    }
    
    // 5. عرض التقرير النهائي
    console.log('━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━');
    if (results.found) {
        console.log(`✅ ✅ ✅ النتيجة: تم العثور على المستخدم! ✅ ✅ ✅`);
        console.log(`📍 المواقع التي تم العثور فيها:`);
        results.locations.forEach(loc => {
            console.log(`   - ${loc.location} (UID: ${loc.uid || 'N/A'})`);
        });
    } else {
        console.log(`❌ ❌ ❌ النتيجة: لم يتم العثور على المستخدم! ❌ ❌ ❌`);
        if (results.errors.length > 0) {
            console.log(`⚠️ الأخطاء المسجلة:`);
            results.errors.forEach(err => console.log(`   - ${err}`));
        }
        console.log(`💡 اقتراحات:`);
        console.log(`   1. تأكد من كتابة المعرف بشكل صحيح (حساس لحالة الأحرف)`);
        console.log(`   2. إذا كان بريداً إلكترونياً، تأكد من صيغته (مثال: user@tecno.com)`);
        console.log(`   3. إذا كان اسم مستخدم، تأكد من أنه ينتهي بـ @tecno.shark`);
        console.log(`   4. تحقق من بنية البيانات في Firebase Console`);
    }
    console.log('━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━');
    console.groupEnd();
    
    return results;
}
    // ==================== بدء التشغيل ====================
    getReturnUrl();
    render();
    
    // إضافة Font Awesome
    if (!document.querySelector('link[href*="font-awesome"]')) {
        const link = document.createElement('link');
        link.rel = 'stylesheet';
        link.href = 'https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css';
        document.head.appendChild(link);
    }
</script>
</body>
